
<section class="hero">
  <div class="container-app hero-content">
    <h1>موضة العصر بأسعار تناسبك</h1>
    <p>تسوقي أحدث صيحات الموضة رجالي وحريمي وأطفال</p>
    <a routerLink="/products-list" class="btn btn-accent">تسوق الآن</a>
  </div>
</section>

<section class="container-app section">
  <h2 class="section-title">الأكثر مبيعًا</h2>
  <div class="products-grid">
    @for (product of topSales; track product._id) {
      <app-product [myProduct]="product"></app-product>
    } @empty {
      <p class="empty-msg">لا توجد منتجات حاليًا</p>
    }
  </div>
</section>

<section class="container-app section">
  <h2 class="section-title">وصل حديثًا</h2>
  <div class="products-grid">
    @for (product of newArrivals; track product._id) {
      <app-product [myProduct]="product"></app-product>
    } @empty {
      <p class="empty-msg">لا توجد منتجات حاليًا</p>
    }
  </div>
</section>
